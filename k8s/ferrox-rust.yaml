apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrox-rust
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ferrox-rust
  template:
    metadata:
      labels:
        app: ferrox-rust
    spec:
      containers:
      - name: ferrox-rust
        image: ferrox-rust:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_URL
          value: "redis://redis-cluster:6379"
        - name: DB_URL
          value: "postgres://user:password@postgres:5432/ferrox"
        - name: KAFKA_BROKER
          value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: ferrox-rust
spec:
  selector:
    app: ferrox-rust
  ports:
  - port: 8080
    targetPort: 8080
  type: LoadBalancer
