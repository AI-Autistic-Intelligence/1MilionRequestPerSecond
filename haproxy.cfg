global
    nbthread 16
    maxconn 500000

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    default-server init-addr last,libc,none

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      30s
    hold refused    30s
    hold nx         30s
    hold timeout    30s
    hold valid      10s
    hold obsolete   30s

frontend node_front
    bind *:13000
    default_backend node_back

backend node_back
    balance roundrobin
    server node1 ferrox-node:3000 check resolvers docker resolve-prefer ipv4

frontend py_front
    bind *:18000
    default_backend py_back

backend py_back
    balance roundrobin
    server py1 ferrox-py:8000 check resolvers docker resolve-prefer ipv4

frontend rust_front
    bind *:18080
    default_backend rust_back

backend rust_back
    balance roundrobin
    server rust1 ferrox-rust:8080 check resolvers docker resolve-prefer ipv4

frontend java_front
    bind *:18081
    default_backend java_back

backend java_back
    balance roundrobin
    server java1 ferrox-java:8081 check resolvers docker resolve-prefer ipv4

frontend php_front
    bind *:18082
    default_backend php_back

backend php_back
    balance roundrobin
    server php1 ferrox-php:8082 check resolvers docker resolve-prefer ipv4
