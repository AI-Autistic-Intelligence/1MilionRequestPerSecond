[package]
name = "ferrox-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.5"
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.25.3", features = ["tokio-comp"] }
deadpool-redis = "0.15.0"
deadpool-postgres = "0.12.1"
tokio-postgres = "0.7.10"
rand = "0.8.5"
prometheus = "0.14.0"
lazy_static = "1.5.1"
